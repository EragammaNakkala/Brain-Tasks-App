version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 092454132995.dkr.ecr.eu-north-1.amazonaws.com

  build:
    commands:
      - echo Build started on `date`
      - echo Building Docker image...
      - docker build -t brain-tasks-app .
      - docker tag brain-tasks-app:latest 092454132995.dkr.ecr.eu-north-1.amazonaws.com/brain-tasks-app:latest

  post_build:
    commands:
      - echo Pushing Docker image to Amazon ECR...
      - docker push 092454132995.dkr.ecr.eu-north-1.amazonaws.com/brain-tasks-app:latest
      - echo Build completed on `date`

artifacts:
  files:
    - '**/*'
